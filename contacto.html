<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevelUpGamer - Contacto</title>
  <link rel="icon" href="./img/LevelupGamer.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/general.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/contacto.css">
  <style>
   
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="./index.html">
        <img src="./img/LevelupGamer.png" alt="logo" width="40" height="40" class="me-2">
        <span class="fw-bold text-neon">LevelUpGamer</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="./index.html"><i class="fa-solid fa-home" style="color: #165eda;"></i> Inicio</a></li>
          <!-- <li class="nav-item"><a class="nav-link" href="pages/catalogo.html"><i class="fa-solid fa-gamepad" style="color: #165eda;"></i> Catálogo</a></li> -->
          <li class="nav-item"><a class="nav-link" href="quienes-somos.html"><i class="fa-solid fa-people-line fa-fade" style="color: #63E6BE;"></i> Quiénes Somos</a></li>
          <li class="nav-item"><a class="nav-link active" href="./contacto.html"><i class="fas fa-envelope me-1 fa-fade"></i> Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>📩 Contáctanos</h1>
    <p>¿Tienes dudas o necesitas ayuda? Escríbenos y nuestro equipo gamer responderá a la velocidad de la luz 🚀.</p>
  </section>

  <!-- FORMULARIO -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form id="formContacto" class="form-gamer">
          <div class="mb-3">
            <label for="nombre" class="form-label">👤 Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre gamer">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">📧 Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="tuemail@ejemplo.com">
          </div>

          <div class="mb-3">
            <label for="tipoMensaje" class="form-label">📌 Tipo de mensaje</label>
            <select class="form-select" id="tipoMensaje" required>
              <option value="">Selecciona una opción</option>
              <option value="Consulta">Consulta</option>
              <option value="Sugerencia">Sugerencia</option>
              <option value="Reclamo">Reclamo</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label">💬 Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>

          <button type="submit" class="btn btn-gamer w-100">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 <strong>LevelUpGamer</strong> 🎮 | Todos los derechos reservados</p>
  </footer>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/8c365a0d06.js" crossorigin="anonymous"></script>
  <script>
    // Validación con SweetAlert
    document.getElementById("formContacto").addEventListener("submit", function (e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();
      const tipo = document.getElementById("tipoMensaje").value;
      const mensaje = document.getElementById("mensaje").value.trim();

      if (!nombre || !email || !tipo || !mensaje) {
        Swal.fire({
          icon: "error",
          title: "Campos incompletos",
          text: "Por favor completa todos los campos antes de enviar."
        });
        return;
      }

      const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if (!emailRegex.test(email)) {
        Swal.fire({
          icon: "warning",
          title: "Correo inválido",
          text: "Por favor ingresa un correo electrónico válido."
        });
        return;
      }

      // Si pasa validaciones
      Swal.fire({
        icon: "success",
        title: "¡Mensaje enviado!",
        html: `Gracias por contactarnos, <strong>${nombre}</strong>.<br>Tipo de mensaje: <strong>${tipo}</strong>.<br>Te responderemos pronto.`
      });

      // Reset del formulario
      this.reset();
    });
  </script>
</body>

</html>
