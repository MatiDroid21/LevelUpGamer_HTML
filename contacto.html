  <!-- HERO -->
  <section class="hero">
    <h1>📩 Contáctanos</h1>
    <p>¿Tienes dudas o necesitas ayuda? Escríbenos y nuestro equipo gamer responderá a la velocidad de la luz 🚀.</p>
  </section>

  <!-- FORMULARIO -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form id="formContacto" class="form-gamer">
          <div class="mb-3">
            <label for="nombre" class="form-label">👤 Nombre</label>
            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre gamer">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">📧 Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="tuemail@ejemplo.com">
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">💬 Mensaje</label>
            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
          </div>
          <button type="submit" class="btn btn-gamer w-100">Enviar mensaje</button>
        </form>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 <strong>LevelUpGamer</strong> 🎮 | Todos los derechos reservados</p>
  </footer>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Validación con SweetAlert
    document.getElementById("formContacto").addEventListener("submit", function (e) {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();
      const mensaje = document.getElementById("mensaje").value.trim();

      if (!nombre || !email || !mensaje) {
        Swal.fire({
          icon: "error",
          title: "Campos incompletos",
          text: "Por favor completa todos los campos antes de enviar."
        });
        return;
      }

      const emailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if (!emailRegex.test(email)) {
        Swal.fire({
          icon: "warning",
          title: "Correo inválido",
          text: "Por favor ingresa un correo electrónico válido."
        });
        return;
      }

      // Si pasa validaciones
      Swal.fire({
        icon: "success",
        title: "¡Mensaje enviado!",
        text: "Gracias por contactarnos, " + nombre + ". Te responderemos pronto."
      });

      // Reset del formulario
      this.reset();
    });

  </script>
