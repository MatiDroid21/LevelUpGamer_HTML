<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevelUpGamer - Catálogo</title>
  <link rel="icon" href="../img/LevelupGamer.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/cardsIndex.css">
  <link rel="stylesheet" href="../css/catalogo.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
   
</head>

<body>

  <body> <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid"> <!-- Logo --> <a class="navbar-brand" href="#"> <img src="../assets/img/LevelupGamer.png"
            alt="logo" width="30" height="24"> </a> <button class="navbar-toggler" type="button"
          data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"> <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Contenido -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent"> <!-- IZQUIERDA: Menú principal -->
          <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="menuPrincipal">
            <li class="nav-item"> <a class="nav-link active" href="#">Home</a> </li>
          </ul> <!-- CENTRO: Buscador -->
          <form class="d-flex me-3" role="search"> <input id="buscador" class="form-control me-2" type="search"
              placeholder="Buscar producto..." aria-label="Buscar"> </form>
          <!-- DERECHA: Hora + Switch modo oscuro -->
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item d-flex align-items-center"> <span id="reloj" class="nav-link active"></span>
            </li>
          </ul>
          <div class="form-check form-switch text-nowrap ms-3"> <input class="form-check-input" type="checkbox"
              id="themeSwitch"> <label class="form-check-label" for="themeSwitch">💡 /
              🌙</label> </div>
        </div>
      </div>
    </nav>
    <!-- CATALOGO -->
    <section class="container mt-5 mb-5" id="productos">
      <h4 class="mb-4">🎮 Revisa Nuestro Catálogo</h4>
      <div class="row g-4 justify-content-center" id="productosContainer"></div>
    </section>

    
    <script src="../js/catalogo.js"></script>
    <section class="container mt-5 mb-5">
      <h4>🛒 Carrito de Compras</h4>
      <div id="carrito" style="color: rgb(9, 203, 9);"></div>

    </section>
    <script src="https://kit.fontawesome.com/8c365a0d06.js" crossorigin="anonymous"></script>
    <script src="../js/utils/navCatalogo.js"></script>
    <script src="../js/reloj.js"></script>
    <script src="../js/modoOscuro.js"></script>
    <script src="../js/carrito.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
